<!-- Full-bleed source for the platform-masked icons (iOS apple-touch-icon and
     the Android/Chrome `maskable` variant). NO corner radius: the platform
     applies its own mask, and baking one in produces double-rounded corners.
     The ball sits at r=191 (incl. ring), inside the 80% maskable safe circle
     (r=204.8 on a 512 canvas), so no crop shape can clip it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0a0c0a"/>
  <circle cx="256" cy="256" r="188" fill="#0d0d0d" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  <ellipse cx="206" cy="202" rx="56" ry="40" fill="rgba(255,255,255,0.05)" transform="rotate(-20,206,202)"/>
  <circle cx="256" cy="256" r="76" fill="white"/>
  <text x="256" y="298" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="100" font-weight="900" fill="#0a0c0a">8</text>
  <circle cx="256" cy="256" r="188" fill="none" stroke="#1e5c3a" stroke-width="6" opacity="0.4"/>
</svg>
